repos:
  - repo: local
    hooks:
      - id: local-ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude --exit-non-zero-on-format
        require_serial: true
        language: unsupported
        types: [ python ]

      - id: local-ruff-lint
        name: ruff check
        entry: uv run ruff check --force-exclude --fix --exit-non-zero-on-fix
        require_serial: true
        language: unsupported
        types: [ python ]

      - id: local-mypy
        name: mypy check
        entry: uv run mypy backend/app mcp/src
        require_serial: true
        language: unsupported
        pass_filenames: false

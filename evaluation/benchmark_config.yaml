settings:
  agy_binary: "agy"
  model: "Gemini 3.8 Flash (Medium)"
  mcp_server_name: "source-context-mcp"
  output_dir: "./eval_results"
  timeout_seconds: 300
  output_format: "stream-json"
  judge:
    model: "gpt-4o-mini"
    temperature: 0.0
    seed: 42

conditions:
  - name: "antigravity_default"
    use_mcp: false
    system_hint: "Use only standard file exploration tools (grep, read, list) to answer the question."

  - name: "antigravity_mcp"
    use_mcp: true
    system_hint: >-
      Use source-context MCP tools to answer the question directly:
      1. For semantic / concept / behavior searches (e.g. identifying mechanisms, security algorithms, or validation rules by description), ALWAYS start with `search_code_snippets`.
      2. For blast radius, callers, and dependencies, use `analyze_impact`, `find_node_usages`, or `find_node_callees`.
      3. For module outline or symbol signatures, `get_file_structure` already provides complete signatures, docstrings, and summaries — do NOT make subsequent redundant calls to `get_node_content` or `get_file_content`.
      4. For dead / unused code, `find_unused_nodes_in_file` directly identifies unused symbols; trust its output without redundant re-checks.

repositories:
  - id: "full-stack-fastapi-template"
    path: "/home/huuhieu/projects/eval_repo_set/full-stack-fastapi-template/backend"
    mcp_context:
      workspace_id: 1
      project_id: 8
      repository_id: 8
      branch: "master"
    questions:
      - q_id: "Q1_blast_radius"
        dimension: "D1_Impact"
        text: "If the database CRUD utility `get_user_by_email` changes its signature or return type, which endpoints, services, and caller functions across the codebase will be directly affected? List the affected callers and their locations."
        ground_truth:
          target_symbols: ["get_user_by_email"]
          target_files:
            - "backend/app/crud.py"
            - "backend/app/api/routes/users.py"
            - "backend/app/api/routes/login.py"
          atomic_facts:
            - id: "fact_caller_authenticate"
              weight: 20
              description: "Identifies caller `authenticate` in `backend/app/crud.py`."
            - id: "fact_caller_user_creation"
              weight: 25
              description: "Identifies callers `create_user` and `register_user` in `backend/app/api/routes/users.py`."
            - id: "fact_caller_user_update"
              weight: 25
              description: "Identifies callers `update_user_me` and `update_user` in `backend/app/api/routes/users.py`."
            - id: "fact_caller_password_recovery"
              weight: 15
              description: "Identifies callers `recover_password` and `recover_password_html_content` in `backend/app/api/routes/login.py`."
            - id: "fact_caller_password_reset"
              weight: 15
              description: "Identifies caller `reset_password` in `backend/app/api/routes/login.py`."

      - q_id: "Q2_security_callers"
        dimension: "D2_Usages"
        text: "Which routines, handlers, and services across the application invoke the `get_password_hash` helper?"
        ground_truth:
          target_symbols: ["get_password_hash"]
          target_files:
            - "backend/app/core/security.py"
            - "backend/app/crud.py"
            - "backend/app/api/routes/users.py"
            - "backend/app/api/routes/private.py"
          atomic_facts:
            - id: "fact_crud_create_user"
              weight: 25
              description: "Identifies caller `create_user` in `backend/app/crud.py` hashing the initial password for a new user."
            - id: "fact_crud_update_user"
              weight: 25
              description: "Identifies caller `update_user` in `backend/app/crud.py` hashing updated passwords during user updates."
            - id: "fact_routes_update_password_me"
              weight: 25
              description: "Identifies caller `update_password_me` in `backend/app/api/routes/users.py` hashing the new password when a user updates their own password."
            - id: "fact_routes_private_create_user"
              weight: 25
              description: "Identifies caller `create_user` in `backend/app/api/routes/private.py` hashing passwords for private endpoint user creation."

      - q_id: "Q3_core_dependencies"
        dimension: "D3_Callees"
        text: "What internal helper functions, security utilities, and subsystem routines are directly invoked by `recover_password` during password recovery?"
        ground_truth:
          target_symbols:
            - "recover_password"
            - "get_user_by_email"
            - "generate_password_reset_token"
            - "generate_reset_password_email"
            - "send_email"
          target_files:
            - "backend/app/api/routes/login.py"
            - "backend/app/crud.py"
            - "backend/app/utils.py"
          atomic_facts:
            - id: "fact_callee_crud_user_lookup"
              weight: 25
              description: "Identifies direct call to `crud.get_user_by_email` (defined in `backend/app/crud.py`) to verify whether the target user exists in the database."
            - id: "fact_callee_generate_token"
              weight: 25
              description: "Identifies direct call to `generate_password_reset_token` (defined in `backend/app/utils.py`) to generate a signed JWT password reset token."
            - id: "fact_callee_generate_email_template"
              weight: 25
              description: "Identifies direct call to `generate_reset_password_email` (defined in `backend/app/utils.py`) to render the password recovery email template with the reset link."
            - id: "fact_callee_send_email"
              weight: 25
              description: "Identifies direct call to `send_email` (defined in `backend/app/utils.py`) to dispatch the generated password recovery email via SMTP."

      - q_id: "Q4_semantic_search"
        dimension: "D4_Semantic"
        text: "Find the component responsible for mitigating timing attacks during user authentication when a requested email does not exist in the database, and explain how its mechanism works and which endpoint utilizes it."
        ground_truth:
          target_symbols:
            - "authenticate"
            - "DUMMY_HASH"
          target_files:
            - "backend/app/crud.py"
            - "backend/app/api/routes/login.py"
          atomic_facts:
            - id: "fact_target_symbol"
              weight: 35
              description: "Identifies the target function `authenticate` and constant `DUMMY_HASH` in `backend/app/crud.py`."
            - id: "fact_implementation_logic"
              weight: 35
              description: "Explains that when `db_user` is not found (`None`), the function executes `verify_password(password, DUMMY_HASH)` against a precomputed Argon2 dummy hash to ensure constant response time and prevent user enumeration timing attacks."
            - id: "fact_caller_context"
              weight: 30
              description: "Identifies the calling endpoint `login_access_token` (`POST /login/access-token`) in `backend/app/api/routes/login.py` that utilizes `crud.authenticate`."

      - q_id: "Q5_dead_code"
        dimension: "D5_DeadCode"
        text: "In the database CRUD layer, identify any top-level entity creation, conversion, or retrieval function that is never invoked or referenced anywhere across the application (excluding test files), and confirm whether the other CRUD functions in that module remain actively utilized."
        ground_truth:
          target_symbols: ["create_item"]
          target_files:
            - "backend/app/crud.py"
          atomic_facts:
            - id: "fact_unused_detected"
              weight: 60
              description: "Correctly identifies `create_item` in `backend/app/crud.py` as having zero incoming references or calls across the entire application codebase (excluding tests)."
            - id: "fact_active_symbols_differentiated"
              weight: 40
              description: "Correctly distinguishes that all other CRUD functions in the same module (`create_user`, `update_user`, `get_user_by_email`, and `authenticate`) are actively imported and invoked across `backend/app/core/db.py`, `backend/app/api/routes/users.py`, and `backend/app/api/routes/login.py`."

      - q_id: "Q6_module_outline"
        dimension: "D6_Structure"
        text: "Inspect the email dispatch and notification template module and summarize all top-level functions defined in it, including their exact parameter signatures, return types, and purpose."
        ground_truth:
          target_symbols:
            - "render_email_template"
            - "send_email"
            - "generate_test_email"
            - "generate_reset_password_email"
            - "generate_new_account_email"
            - "generate_password_reset_token"
            - "verify_password_reset_token"
          target_files:
            - "backend/app/utils.py"
          atomic_facts:
            - id: "fact_render_email_template"
              weight: 15
              description: "Summarizes `render_email_template(*, template_name: str, context: dict[str, Any]) -> str` for rendering Jinja2 HTML email templates."
            - id: "fact_send_email"
              weight: 15
              description: "Summarizes `send_email(*, email_to: str, subject: str = \"\", html_content: str = \"\") -> None` for sending emails via configured SMTP settings."
            - id: "fact_generate_test_email"
              weight: 10
              description: "Summarizes `generate_test_email(email_to: str) -> EmailData` for creating test email content and subject."
            - id: "fact_generate_reset_password_email"
              weight: 15
              description: "Summarizes `generate_reset_password_email(email_to: str, email: str, token: str) -> EmailData` for creating password recovery emails with reset links."
            - id: "fact_generate_new_account_email"
              weight: 15
              description: "Summarizes `generate_new_account_email(email_to: str, username: str, password: str) -> EmailData` for creating welcome emails containing login credentials."
            - id: "fact_generate_password_reset_token"
              weight: 15
              description: "Summarizes `generate_password_reset_token(email: str) -> str` for generating timed JWT password recovery tokens."
            - id: "fact_verify_password_reset_token"
              weight: 15
              description: "Summarizes `verify_password_reset_token(token: str) -> str | None` for validating JWT recovery tokens and extracting the user email."
  - id: "cli"
    path: "/home/huuhieu/projects/eval_repo_set/cli"
    mcp_context:
      workspace_id: 1
      project_id: 9
      repository_id: 9
      branch: "master"
    questions:
      - q_id: "Q1_blast_radius"
        dimension: "D1_Impact"
        text: "If the request and response headers data structure `HTTPHeadersDict` changes its initialization signature or core dict manipulation interface, which components, adapters, and caller functions across the codebase will be directly affected? List the affected callers and their locations."
        ground_truth:
          target_symbols: ["HTTPHeadersDict"]
          target_files:
            - "httpie/cli/dicts.py"
            - "httpie/adapters.py"
            - "httpie/sessions.py"
            - "httpie/cli/requestitems.py"
            - "httpie/client.py"
            - "httpie/output/writer.py"
          atomic_facts:
            - id: "fact_caller_adapters"
              weight: 25
              description: "Identifies caller `HTTPieHTTPAdapter.build_response` in `httpie/adapters.py` which wraps incoming response headers into an `HTTPHeadersDict` instance to preserve multiple headers with identical names."
            - id: "fact_caller_sessions"
              weight: 25
              description: "Identifies callers in `httpie/sessions.py` including `Session.__init__`, `Session._compute_new_headers`, `Session.update_headers`, and the `Session.headers` property which use `HTTPHeadersDict` to store and merge session headers."
            - id: "fact_caller_requestitems"
              weight: 25
              description: "Identifies caller `RequestItems.__init__` in `httpie/cli/requestitems.py` which initializes `self.headers` as an `HTTPHeadersDict` to collect parsed CLI header items."
            - id: "fact_caller_client"
              weight: 25
              description: "Identifies callers in `httpie/client.py` including `finalize_headers`, `apply_missing_repeated_headers`, `make_default_headers`, and `make_request_kwargs` which construct, normalize, and pass `HTTPHeadersDict` instances for outgoing requests."

      - q_id: "Q2_security_callers"
        dimension: "D2_Usages"
        text: "Which routines, handlers, and services across the application invoke the `get_auth_plugin` helper?"
        ground_truth:
          target_symbols: ["get_auth_plugin"]
          target_files:
            - "httpie/plugins/manager.py"
            - "httpie/sessions.py"
            - "httpie/cli/argparser.py"
          atomic_facts:
            - id: "fact_usage_sessions"
              weight: 50
              description: "Identifies caller `Session.auth` property in `httpie/sessions.py` which calls `plugin_manager.get_auth_plugin(auth['type'])` to resolve and instantiate the authentication plugin for stored session credentials."
            - id: "fact_usage_argparser"
              weight: 50
              description: "Identifies caller `HTTPieArgumentParser._process_auth` in `httpie/cli/argparser.py` which calls `plugin_manager.get_auth_plugin(self.args.auth_type)` to instantiate the configured authentication plugin based on parsed CLI arguments."

      - q_id: "Q3_core_dependencies"
        dimension: "D3_Callees"
        text: "What internal helper functions, security utilities, and subsystem routines are directly invoked by `collect_messages` during the HTTP request preparation, dispatch, and response collection pipeline?"
        ground_truth:
          target_symbols: ["collect_messages"]
          target_files:
            - "httpie/client.py"
          atomic_facts:
            - id: "fact_callee_session_handling"
              weight: 25
              description: "Identifies invocation of `get_httpie_session` to retrieve persistent session configuration, and session mutating methods `update_headers`, `remove_cookies`, and `save`."
            - id: "fact_callee_args_builder"
              weight: 25
              description: "Identifies invocation of `make_request_kwargs`, `make_send_kwargs`, and `make_send_kwargs_mergeable_from_env` to assemble request headers, data parameters, and transport options."
            - id: "fact_callee_build_session"
              weight: 25
              description: "Identifies invocation of `build_requests_session` to initialize the transport session with custom TLS adapters, SSL version mappings, and certificate verification."
            - id: "fact_callee_transforms_and_cookies"
              weight: 25
              description: "Identifies invocations of pipeline helpers including `transform_headers`, `ensure_path_as_is`, `compress_request`, `max_headers` context manager, `dump_request`, and `get_expired_cookies`."

      - q_id: "Q4_semantic_search"
        dimension: "D4_Semantic"
        text: "Find the component responsible for overriding standard cookie security policy to permit cookies flagged with the 'Secure' attribute to be transmitted to localhost destinations over unencrypted HTTP, and explain how its detection algorithm works and which services configure or utilize this policy."
        ground_truth:
          target_symbols:
            - "HTTPieCookiePolicy"
            - "HTTPieCookiePolicy.return_ok_secure"
            - "HTTPieCookiePolicy._is_local_host"
          target_files:
            - "httpie/cookies.py"
            - "httpie/compat.py"
            - "httpie/sessions.py"
          atomic_facts:
            - id: "fact_target_symbol"
              weight: 40
              description: "Correctly identifies the target class `HTTPieCookiePolicy` in `httpie/cookies.py` extending `http.cookiejar.DefaultCookiePolicy`."
            - id: "fact_implementation_logic"
              weight: 30
              description: "Accurately explains the detection mechanism: `return_ok_secure` first delegates to `super().return_ok_secure(cookie, request)`, and if false, extracts the hostname using `cookiejar.request_host(request)` and checks via `_is_local_host` whether the host is exactly 'localhost' or ends with '.localhost' (mimicking Firefox/Chrome behavior)."
            - id: "fact_caller_context"
              weight: 30
              description: "Identifies that `HTTPieCookiePolicy` is utilized in `httpie/compat.py` by monkeypatching `cookiejar.DefaultCookiePolicy = HTTPieCookiePolicy` and in `httpie/sessions.py` where `Session` explicitly instantiates `RequestsCookieJar(policy=HTTPieCookiePolicy())`."

      - q_id: "Q5_dead_code"
        dimension: "D5_DeadCode"
        text: "In the general utilities and shared helpers component (without naming the file), identify any top-level entity conversion or formatting function that is never invoked or referenced anywhere across the application (excluding test files)."
        ground_truth:
          target_symbols: ["humanize_bytes"]
          target_files:
            - "httpie/utils.py"
          atomic_facts:
            - id: "fact_unused_detected"
              weight: 60
              description: "Correctly identifies `humanize_bytes` in `httpie/utils.py` as having zero incoming calls or references across the entire codebase."
            - id: "fact_active_symbols_differentiated"
              weight: 40
              description: "Correctly distinguishes that other top-level functions in `httpie/utils.py` (such as `load_json_preserve_order_and_dupe_keys`, `repr_dict`, `get_content_type`, `split_cookies`, `get_expired_cookies`, `parse_content_type_header`, `get_site_paths`, `split_iterable`, `unwrap_context`, `url_as_host`, `open_with_lockfile`, and `is_version_greater`) are actively referenced across other application components."

      - q_id: "Q6_module_outline"
        dimension: "D6_Structure"
        text: "Inspect the character encoding, decoding, and charset detection module (without naming the file) and summarize all top-level functions defined in it, including their exact parameter signatures, return types, and purpose."
        ground_truth:
          target_symbols:
            - "detect_encoding"
            - "smart_decode"
            - "smart_encode"
          target_files:
            - "httpie/encoding.py"
          atomic_facts:
            - id: "fact_symbol_detect_encoding"
              weight: 35
              description: "Summarizes `detect_encoding(content: ContentBytes) -> str` (where `ContentBytes = Union[bytearray, bytes]`) with purpose: detects charset encoding using `charset_normalizer.from_bytes`, defaulting to 'utf-8' if content length is less than or equal to `TOO_SMALL_SEQUENCE` to avoid random detection artifacts."
            - id: "fact_symbol_smart_decode"
              weight: 35
              description: "Summarizes `smart_decode(content: ContentBytes, encoding: str) -> Tuple[str, str]` with purpose: decodes raw bytes using the specified encoding (or falls back to `detect_encoding(content)` if not provided) replacing decoding errors, returning a tuple of `(decoded_string, effective_encoding)`."
            - id: "fact_symbol_smart_encode"
              weight: 30
              description: "Summarizes `smart_encode(content: str, encoding: str) -> bytes` with purpose: encodes unicode string into bytes using the given encoding while replacing unencodable characters with error replacement."

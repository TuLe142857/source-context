settings:
  agy_binary: "agy"
  model: "Gemini 3.8 Flash (Medium)"
  mcp_server_name: "source-context-mcp"
  output_dir: "./eval_results"
  timeout_seconds: 300
  output_format: "stream-json"
  judge:
    model: "gpt-4o-mini"
    temperature: 0.0
    seed: 42

conditions:
  - name: "antigravity_default"
    use_mcp: false
    system_hint: "Use only standard file exploration tools (grep, read, list) to answer the question."

  - name: "antigravity_mcp"
    use_mcp: true
    system_hint: "Use source-context MCP tools to answer the question directly. Trust Graph, AST, and Vector search results directly — do NOT make redundant read_file or get_file_content calls to re-verify code that MCP tools already provided."

repositories:
  - id: "django"
    path: "/home/huuhieu/projects/django/django"
    mcp_context:
      workspace_id: 1
      project_id: 1
      repository_id: 1
      branch: "main"
    questions:
      - q_id: "Q1_blast_radius"
        dimension: "D1_Impact"
        text: "If the active user model resolution helper get_user_model changes its signature or return type, which views, forms, authentication backends, and management commands across the codebase will be directly affected? List the affected caller functions and their containing files."
        ground_truth:
          target_symbols: ["get_user_model"]
          target_files:
            - "django/contrib/auth/__init__.py"
            - "django/contrib/auth/views.py"
            - "django/contrib/auth/forms.py"
            - "django/contrib/auth/backends.py"
            - "django/contrib/auth/management/commands/changepassword.py"
            - "django/contrib/auth/management/commands/createsuperuser.py"
          atomic_facts:
            - id: "fact_views"
              weight: 25
              description: "Identifies affected auth views in django/contrib/auth/views.py (module-level UserModel binding and/or PasswordResetConfirmView.get_user)."
            - id: "fact_forms"
              weight: 25
              description: "Identifies affected auth forms in django/contrib/auth/forms.py (module-level UserModel binding, AuthenticationForm, PasswordResetForm, or UserCreationForm)."
            - id: "fact_backends"
              weight: 25
              description: "Identifies affected authentication backends in django/contrib/auth/backends.py (ModelBackend and/or RemoteUserBackend methods like authenticate, get_user, with_perm)."
            - id: "fact_commands"
              weight: 25
              description: "Identifies affected management commands: changepassword.py and/or createsuperuser.py in django/contrib/auth/management/commands/."

      - q_id: "Q2_security_callers"
        dimension: "D2_Usages"
        text: "Which security routines, middleware components, cryptographic signers, and authentication handlers across the application call the timing-safe string comparison helper constant_time_compare?"
        ground_truth:
          target_symbols: ["constant_time_compare"]
          target_files: ["django/utils/crypto.py"]
          atomic_facts:
            - id: "fact_csrf"
              weight: 25
              description: "Identifies CSRF token validation caller in django/middleware/csrf.py (_does_token_match)."
            - id: "fact_signers"
              weight: 25
              description: "Identifies cryptographic signing caller in django/core/signing.py (Signer.unsign)."
            - id: "fact_auth_handlers"
              weight: 25
              description: "Identifies session authentication and hash verification callers in django/contrib/auth/__init__.py (login, alogin, get_user, aget_user)."
            - id: "fact_hashers_tokens"
              weight: 25
              description: "Identifies password hash verification callers in django/contrib/auth/hashers.py (verify methods) and/or PasswordResetTokenGenerator.check_token in tokens.py."

      - q_id: "Q3_login_dependencies"
        dimension: "D3_Callees"
        text: "What internal helper functions, security utilities, and signal dispatchers are directly invoked by the session establishment function login in the authentication module?"
        ground_truth:
          target_symbols: ["login"]
          target_files: ["django/contrib/auth/__init__.py"]
          atomic_facts:
            - id: "fact_session_cycle"
              weight: 25
              description: "Identifies session key cycling/flushing via request.session.cycle_key() or flush()."
            - id: "fact_session_hash"
              weight: 25
              description: "Identifies session hash retrieval or verification via user.get_session_auth_hash() or _get_user_session_key(request)."
            - id: "fact_crypto_compare"
              weight: 25
              description: "Identifies timing-safe comparison via constant_time_compare to prevent timing attacks on session authentication."
            - id: "fact_signals"
              weight: 25
              description: "Identifies signal dispatching to listeners via user_logged_in.send()."

      - q_id: "Q4_semantic_search"
        dimension: "D4_Semantic"
        text: "Find the class responsible for generating and validating one-time password reset tokens using HMAC and timestamp encoding, and describe how its token validation mechanism determines whether a token has expired or is invalid."
        ground_truth:
          target_symbols: ["PasswordResetTokenGenerator", "check_token"]
          target_files: ["django/contrib/auth/tokens.py"]
          atomic_facts:
            - id: "fact_target_class"
              weight: 25
              description: "Identifies the target class PasswordResetTokenGenerator located in django/contrib/auth/tokens.py."
            - id: "fact_token_split"
              weight: 25
              description: "Explains token format parsing: splits token on hyphen delimiter (-) into base36 timestamp (ts_b36) and HMAC hash string."
            - id: "fact_expiration_check"
              weight: 25
              description: "Explains expiration check: decodes base36 timestamp with base36_to_int and verifies elapsed time against PASSWORD_RESET_TIMEOUT."
            - id: "fact_hmac_verification"
              weight: 25
              description: "Explains state & HMAC verification: regenerates expected hash using _make_token_with_timestamp and checks with constant_time_compare."

      - q_id: "Q5_dead_code"
        dimension: "D5_DeadCode"
        text: "In the web shortcuts module (shortcuts.py), identify which asynchronous or synchronous helper functions have zero incoming calls or references anywhere else in the Django framework (excluding tests)."
        ground_truth:
          target_symbols: ["aget_object_or_404", "aget_list_or_404"]
          target_files: ["django/shortcuts.py"]
          atomic_facts:
            - id: "fact_unused_shortcuts"
              weight: 50
              description: "Identifies asynchronous shortcuts aget_object_or_404 and/or aget_list_or_404 in django/shortcuts.py as having zero incoming references across Django."
            - id: "fact_used_shortcuts"
              weight: 50
              description: "Correctly recognizes that synchronous shortcuts (render, redirect, get_object_or_404) are actively called and referenced across the framework."

      - q_id: "Q6_module_outline"
        dimension: "D6_Structure"
        text: "Inspect shortcuts.py and summarize all top-level HTTP response, redirect, and model object retrieval helper functions defined in it, including their exact parameter signatures and docstrings."
        ground_truth:
          target_files: ["django/shortcuts.py"]
          atomic_facts:
            - id: "fact_render"
              weight: 25
              description: "Summarizes render(request, template_name, context=None, content_type=None, status=None, using=None) for rendering templates."
            - id: "fact_redirect"
              weight: 25
              description: "Summarizes redirect(to, *args, permanent=False, **kwargs) for HTTP redirection."
            - id: "fact_get_object_or_404"
              weight: 25
              description: "Summarizes get_object_or_404(klass, *args, **kwargs) and get_list_or_404(klass, *args, **kwargs)."
            - id: "fact_async_shortcuts"
              weight: 25
              description: "Summarizes async variants aget_object_or_404 and aget_list_or_404 with parameter signatures."

  - id: "full-stack-fastapi-template"
    path: "/home/huuhieu/projects/full-stack-fastapi-template/backend"
    mcp_context:
      workspace_id: 1
      project_id: 2
      repository_id: 2
      branch: "master"
    questions:
      - q_id: "Q1_blast_radius"
        dimension: "D1_Impact"
        text: "If the user retrieval function get_user_by_email changes its signature or return type, which route handlers, services, and authentication endpoints across the codebase will be directly affected? List the caller functions and their containing files."
        ground_truth:
          target_symbols: ["get_user_by_email"]
          target_files: ["backend/app/crud.py"]
          atomic_facts:
            - id: "fact_login_routes"
              weight: 35
              description: "Identifies login route callers in app/api/routes/login.py: login_access_token and/or recover_password."
            - id: "fact_user_routes"
              weight: 35
              description: "Identifies user creation callers in app/api/routes/users.py: create_user and/or create_user_open."
            - id: "fact_initial_data"
              weight: 30
              description: "Identifies initial database seeding caller in app/initial_data.py or app/core/db.py (init_db)."

      - q_id: "Q2_security_callers"
        dimension: "D2_Usages"
        text: "Which route handlers and services across the application call the password verification helper verify_password?"
        ground_truth:
          target_symbols: ["verify_password"]
          target_files: ["backend/app/core/security.py"]
          atomic_facts:
            - id: "fact_crud_authenticate"
              weight: 50
              description: "Identifies primary caller authenticate function in app/crud.py verifying plain passwords against stored hashed passwords."
            - id: "fact_user_password_update"
              weight: 50
              description: "Identifies password update caller in app/api/routes/users.py: update_password_me (verifying current password before updating)."

      - q_id: "Q3_init_dependencies"
        dimension: "D3_Callees"
        text: "What internal helper functions, security utilities, or database routines are directly invoked during the initial database setup in init_db?"
        ground_truth:
          target_symbols: ["init_db"]
          target_files: ["backend/app/core/db.py", "backend/app/initial_data.py"]
          atomic_facts:
            - id: "fact_user_lookup"
              weight: 35
              description: "Identifies user lookup routine crud.get_user_by_email checking if FIRST_SUPERUSER already exists."
            - id: "fact_user_creation"
              weight: 35
              description: "Identifies user creation routine crud.create_user initializing the first superuser account with UserCreate."
            - id: "fact_session_ops"
              weight: 30
              description: "Identifies database session operations: session.add() and/or session.commit()."

      - q_id: "Q4_semantic_search"
        dimension: "D4_Semantic"
        text: "Find the function responsible for decoding a password-reset token and returning the subject email, and identify which endpoint calls it to complete the password reset flow."
        ground_truth:
          target_symbols: ["verify_password_reset_token", "reset_password"]
          target_files: ["backend/app/utils.py", "backend/app/api/routes/login.py"]
          atomic_facts:
            - id: "fact_decoding_function"
              weight: 40
              description: "Identifies verify_password_reset_token located in app/utils.py responsible for decoding token and returning subject email."
            - id: "fact_token_decoding_logic"
              weight: 30
              description: "Explains token decoding logic: uses jwt.decode with settings.SECRET_KEY and security.ALGORITHM to extract decoded_token['sub']."
            - id: "fact_endpoint_caller"
              weight: 30
              description: "Identifies the calling endpoint reset_password in app/api/routes/login.py completing the password reset flow."

      - q_id: "Q5_dead_code"
        dimension: "D5_DeadCode"
        text: "In the database CRUD module (crud.py), identify any top-level entity creation or retrieval function that is never called by any route handler or application service (excluding test files)."
        ground_truth:
          target_symbols: ["create_item"]
          target_files: ["backend/app/crud.py"]
          atomic_facts:
            - id: "fact_unused_crud_entity"
              weight: 60
              description: "Identifies create_item in app/crud.py as having zero incoming references from application route handlers or services."
            - id: "fact_active_crud_entities"
              weight: 40
              description: "Distinguishes that user-related CRUD functions (create_user, get_user_by_email, authenticate, update_user) are actively called by route handlers."

      - q_id: "Q6_module_outline"
        dimension: "D6_Structure"
        text: "Inspect utils.py and summarize all email generation and template rendering functions defined in it, including their exact parameter signatures and return types."
        ground_truth:
          target_files: ["backend/app/utils.py"]
          atomic_facts:
            - id: "fact_send_email"
              weight: 25
              description: "Summarizes send_email(email_to: str, subject_template: str = '', html_template: str = '', environment: dict[str, Any] = None) -> None."
            - id: "fact_render_template"
              weight: 25
              description: "Summarizes render_email_template(template_name: str, context: dict[str, Any]) -> str."
            - id: "fact_password_reset_email"
              weight: 25
              description: "Summarizes generate_reset_password_email(email_to: str, email: str, token: str) -> EmailData."
            - id: "fact_account_and_test_emails"
              weight: 25
              description: "Summarizes generate_new_account_email and/or generate_test_email functions returning EmailData."

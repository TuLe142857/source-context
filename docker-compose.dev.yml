services:
  frontend:
    image: source-context/frontend:dev
    build:
      context: ./frontend
      target: dev
    ports:
      - "127.0.0.1:${SOURCE_CONTEXT_FRONTEND_HOST_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

  backend:
    image: source-context/backend:dev
    build:
      dockerfile: ./backend/Dockerfile
      context: .
      target: dev
    ports:
      - "127.0.0.1:${SOURCE_CONTEXT_BACKEND_HOST_PORT:-8000}:8000"
    volumes:
      - ./backend:/app/backend
      - ./pyproject.toml:/app/pyproject.toml
      - ./uv.lock:/app/uv.lock

  celery-worker:
    image: source-context/backend:dev
    build:
      dockerfile: ./backend/Dockerfile
      context: .
      target: dev
    command: uv run celery -A app.worker.celery_worker worker --loglevel=info
    volumes:
      - ./backend:/app/backend
      - ./pyproject.toml:/app/pyproject.toml
      - ./uv.lock:/app/uv.lock


  # ================================================================================================
  #         ADDITIONAL CONTAINERS FOR DEVELOPMENT ONLY
  # ================================================================================================
  # Redis WebUI
  redis-insight:
    image: redis/redisinsight:latest
    restart: unless-stopped
    environment:
      RI_REDIS_HOST: redis
      RI_REDIS_PORT: 6379
      RI_REDIS_USERNAME: ${SOURCE_CONTEXT_REDIS_USER:?SOURCE_CONTEXT_REDIS_USER is required}
      RI_REDIS_PASSWORD: ${SOURCE_CONTEXT_REDIS_PASSWORD:?SOURCE_CONTEXT_REDIS_PASSWORD is required}
      RI_REDIS_DB: 0
    volumes:
      - redis-insight-data:/data
    ports:
      - "127.0.0.1:${SOURCE_CONTEXT_REDIS_INSIGHT_HOST_PORT:-5540}:5540"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:5540/api/health/ || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Fake SMTP Server
  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SOURCE_CONTEXT_MAILHOG_SMTP_HOST_PORT:-1025}:1025"
      - "127.0.0.1:${SOURCE_CONTEXT_MAILHOG_HTTP_HOST_PORT:-8025}:8025"

volumes:
  redis-insight-data:
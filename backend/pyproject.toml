[project]
name = "source-context-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.5",
    "fastapi[standard]>=0.139.0",
    "pydantic>=2.13.4",
    "sqlalchemy>=2.0.51",
    "tabulate>=0.10.0",
    "tree-sitter>=0.26.0",
    "tree-sitter-java>=0.23.5",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-python>=0.25.0",
    "typer>=0.26.8",
]

[tool.uv]
package=true

[tool.setuptools]
packages = ["app", "cli"]

[project.scripts]
cli="cli:run"

[tool.ruff]
extend = "../pyproject.toml"

[tool.ruff.lint.isort]
known-third-party = [
    "tree-sitter-*",
    "fastapi",
    "pydantic",
    "tabulate",
    "typer"
]
known-first-party = [
    "app"
]

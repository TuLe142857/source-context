[project]
name = "source-context-backend"
version = "0.1.0"
description = "Backend indexing and retrieval service for Source Context."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi[standard]>=0.139.2",
    "pathspec>=1.1.1",
    "pydantic-settings>=2.14.2",
    "tabulate>=0.10.0",
    "tree-sitter>=0.26.0",
    "tree-sitter-java>=0.23.5",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-python>=0.25.0",
    "typer>=0.26.8",
]

[tool.uv]
package=true

[tool.setuptools]
packages = ["app", "cli"]

[project.scripts]
cli="cli:run"

[build-system]
requires = ["uv_build>=0.11.29,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = [
    "app",
    "workers",
]
module-root = ""


[tool.ruff.lint.isort]
known-third-party = [
    "tree-sitter-*",
    "fastapi",
    "pydantic",
    "tabulate",
    "typer"
]
known-first-party = [
    "app"
]
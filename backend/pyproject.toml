[project]
name = "source-context-backend"
version = "0.1.0"
description = "Backend indexing and retrieval service for Source Context."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "asyncpg>=0.29.0",
    "bcrypt>=4.0.0",
    "docker>=7.2.0",
    "fastapi[standard]>=0.139.2",
    "grpcio-tools>=1.83.0",
    "neo4j~=6.1.0",
    "neomodel~=6.1.0",
    "pathspec>=1.1.1",
    "protobuf>=7.35.1",
    "psycopg[binary]>=3.1.0",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.8.0",
    "sqlalchemy>=2.0.0",
    "tabulate>=0.10.0",
    "tree-sitter==0.25.0",
    "tree-sitter-c>=0.24.2",
    "tree-sitter-c-sharp>=0.23.5",
    "tree-sitter-cpp>=0.23.4",
    "tree-sitter-go>=0.25.0",
    "tree-sitter-html>=0.23.2",
    "tree-sitter-java>=0.23.5",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-php>=0.24.1",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-ruby>=0.23.1",
    "tree-sitter-rust>=0.24.2",
    "tree-sitter-typescript>=0.23.2",
    "typer>=0.26.8",
    "types-protobuf>=7.34.1.20260518",
]

[tool.uv]
package=true

[tool.setuptools]
packages = ["app", "cli"]

[project.scripts]
cli="cli:run"

[tool.ruff.lint.isort]
known-third-party = [
    "tree-sitter-*",
    "fastapi",
    "pydantic",
    "tabulate",
    "typer"
]
known-first-party = [
    "app"
]

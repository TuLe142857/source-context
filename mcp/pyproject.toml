[project]
name = "source-context-mcp"
version = "0.1.0"
description = "Local MCP server for the Source Context platform."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastmcp",
]

[project.scripts]
source-context-mcp = "source_context_mcp.__main__:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "source_context_mcp"
x-healthcheck-defaults: &healthcheck_base
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 10s

x-common-env: &common-env
  SOURCE_CONTEXT_ENV_STATE: ${SOURCE_CONTEXT_ENV_STATE:?SOURCE_CONTEXT_ENV_STATE is required}
  SOURCE_CONTEXT_ENVIRONMENT: ${SOURCE_CONTEXT_ENVIRONMENT:?SOURCE_CONTEXT_ENVIRONMENT is required}
  SOURCE_CONTEXT_SECRET_KEY: ${SOURCE_CONTEXT_SECRET_KEY:?SOURCE_CONTEXT_SECRET_KEY is required}

  SOURCE_CONTEXT_POSTGRES_HOST: ${SOURCE_CONTEXT_POSTGRES_HOST:?SOURCE_CONTEXT_POSTGRES_HOST is required}
  SOURCE_CONTEXT_POSTGRES_PORT: ${SOURCE_CONTEXT_POSTGRES_PORT:?SOURCE_CONTEXT_POSTGRES_PORT is required}
  SOURCE_CONTEXT_POSTGRES_DB: ${SOURCE_CONTEXT_POSTGRES_DB:?SOURCE_CONTEXT_POSTGRES_DB is required}
  SOURCE_CONTEXT_POSTGRES_USER: ${SOURCE_CONTEXT_POSTGRES_USER:?SOURCE_CONTEXT_POSTGRES_USER is required}
  SOURCE_CONTEXT_POSTGRES_PASSWORD: ${SOURCE_CONTEXT_POSTGRES_PASSWORD:?SOURCE_CONTEXT_POSTGRES_PASSWORD is required}

  SOURCE_CONTEXT_NEO4J_HOST: ${SOURCE_CONTEXT_NEO4J_HOST:?SOURCE_CONTEXT_NEO4J_HOST is required}
  SOURCE_CONTEXT_NEO4J_PORT: ${SOURCE_CONTEXT_NEO4J_PORT:?SOURCE_CONTEXT_NEO4J_PORT is required}
  SOURCE_CONTEXT_NEO4J_USER: ${SOURCE_CONTEXT_NEO4J_USER:?SOURCE_CONTEXT_NEO4J_USER is required}
  SOURCE_CONTEXT_NEO4J_PASSWORD: ${SOURCE_CONTEXT_NEO4J_PASSWORD:?SOURCE_CONTEXT_NEO4J_PASSWORD is required}

  SOURCE_CONTEXT_REDIS_HOST: ${SOURCE_CONTEXT_REDIS_HOST:?SOURCE_CONTEXT_REDIS_HOST is required}
  SOURCE_CONTEXT_REDIS_PORT: ${SOURCE_CONTEXT_REDIS_PORT:?SOURCE_CONTEXT_REDIS_PORT is required}
  SOURCE_CONTEXT_REDIS_USER: ${SOURCE_CONTEXT_REDIS_USER:?SOURCE_CONTEXT_REDIS_USER is required}
  SOURCE_CONTEXT_REDIS_PASSWORD: ${SOURCE_CONTEXT_REDIS_PASSWORD:?SOURCE_CONTEXT_REDIS_PASSWORD is required}

  SOURCE_CONTEXT_QDRANT_HOST: ${SOURCE_CONTEXT_QDRANT_HOST:?SOURCE_CONTEXT_QDRANT_HOST is required}
  SOURCE_CONTEXT_QDRANT_PORT: ${SOURCE_CONTEXT_QDRANT_PORT:?SOURCE_CONTEXT_QDRANT_PORT is required}
  SOURCE_CONTEXT_QDRANT_GRPC_PORT: ${SOURCE_CONTEXT_QDRANT_GRPC_PORT:?SOURCE_CONTEXT_QDRANT_GRPC_PORT is required}

  SOURCE_CONTEXT_MINIO_ROOT_USER: ${SOURCE_CONTEXT_MINIO_ROOT_USER:?SOURCE_CONTEXT_MINIO_ROOT_USER is required}
  SOURCE_CONTEXT_MINIO_ROOT_PASSWORD: ${SOURCE_CONTEXT_MINIO_ROOT_PASSWORD:?SOURCE_CONTEXT_MINIO_ROOT_PASSWORD is required}

  SOURCE_CONTEXT_SMTP_SERVER: ${SOURCE_CONTEXT_SMTP_SERVER:? Variable is empty or not set}
  SOURCE_CONTEXT_SMTP_PORT: ${SOURCE_CONTEXT_SMTP_PORT:? Variable is empty or not set}
  SOURCE_CONTEXT_SMTP_USER: ${SOURCE_CONTEXT_SMTP_USER:? Variable is emtpy or not set}
  SOURCE_CONTEXT_SMTP_PASSWORD: ${SOURCE_CONTEXT_SMTP_PASSWORD:? Variable is empty or not set}
  SOURCE_CONTEXT_SMTP_SEND_MAIL_FROM: ${SOURCE_CONTEXT_SMTP_SEND_MAIL_FROM:? Variable is empty or not set}
  SOURCE_CONTEXT_SMTP_USE_TLS: ${SOURCE_CONTEXT_SMTP_USE_TLS:-false}

  SOURCE_CONTEXT_OPENAI_API_KEY: ${SOURCE_CONTEXT_OPENAI_API_KEY:-}
  SOURCE_CONTEXT_OPENAI_MODEL: ${SOURCE_CONTEXT_OPENAI_MODEL:-gpt-4o-mini}

  SOURCE_CONTEXT_VOYAGE_API_KEY: ${SOURCE_CONTEXT_VOYAGE_API_KEY:-}
  SOURCE_CONTEXT_VOYAGE_EMBEDDING_MODEL: ${SOURCE_CONTEXT_VOYAGE_EMBEDDING_MODEL:-voyage-code-3}
  GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
  VITE_GITHUB_APP_NAME: ${VITE_GITHUB_APP_NAME:-}

services:
  backend:
#    image: ghcr.io/tule142857/source-context/backend:latest
    restart: unless-stopped
    environment:
      <<: *common-env
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
    expose:
      - "8000"
    ports:
      - "127.0.0.1:${SOURCE_CONTEXT_BACKEND_PORT:-8000}:8000"
    volumes:
      - workspace_repos:/workspace-repositories

  celery-worker:
#    image: ghcr.io/tule142857/source-context/backend:latest
    restart: unless-stopped
    environment:
      <<: *common-env
    depends_on:
      backend:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - workspace_repos:/workspace-repositories
    command: celery -A app.worker.celery_worker worker --loglevel=info

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SOURCE_CONTEXT_POSTGRES_USER:?SOURCE_CONTEXT_POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${SOURCE_CONTEXT_POSTGRES_PASSWORD:?SOURCE_CONTEXT_POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${SOURCE_CONTEXT_POSTGRES_DB:?SOURCE_CONTEXT_POSTGRES_DB is required}
    volumes:
      - ./docker/postgres:/docker-entrypoint-initdb.d/
#      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${SOURCE_CONTEXT_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      <<: *healthcheck_base
      test: ["CMD-SHELL", "pg_isready -U ${SOURCE_CONTEXT_POSTGRES_USER:?SOURCE_CONTEXT_POSTGRES_USER is required} -d ${SOURCE_CONTEXT_POSTGRES_DB:?SOURCE_CONTEXT_POSTGRES_DB is required}"]

  neo4j:
    image: neo4j:community
    restart: unless-stopped
    environment:
      - NEO4J_AUTH=${SOURCE_CONTEXT_NEO4J_USER:?SOURCE_CONTEXT_NEO4J_USER is required}/${SOURCE_CONTEXT_NEO4J_PASSWORD:?SOURCE_CONTEXT_NEO4J_PASSWORD is required}
    ports:
      - "127.0.0.1:${SOURCE_CONTEXT_NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${SOURCE_CONTEXT_NEO4J_PORT:-7867}:7687"
#    volumes:
#      - neo4j_data:/data
    healthcheck:
      <<: *healthcheck_base
      test: [
        "CMD",
        "cypher-shell",
        "-u", "${SOURCE_CONTEXT_NEO4J_USER:?SOURCE_CONTEXT_NEO4J_USER is required}",
        "-p", "${SOURCE_CONTEXT_NEO4J_PASSWORD:?SOURCE_CONTEXT_NEO4J_PASSWORD is required}",
        "RETURN 1"
      ]

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    environment:
      - QDRANT__TELEMETRY_DISABLED=true
#    volumes:
#      - qdrant_data:/qdrant/storage
    healthcheck:
      <<: *healthcheck_base
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]

  redis:
    image: redis:8.6
    restart: unless-stopped
    command: >
      redis-server
      --user default off
      --user ${SOURCE_CONTEXT_REDIS_USER:?SOURCE_CONTEXT_REDIS_USER is required} on ">${SOURCE_CONTEXT_REDIS_PASSWORD:?SOURCE_CONTEXT_REDIS_PASSWORD is required}" allcommands allkeys allchannels
    ports:
      - "127.0.0.1:${SOURCE_CONTEXT_REDIS_PORT:-6379}:6379"
#    volumes:
#      - redis_data:/data
    healthcheck:
      <<: *healthcheck_base
      test: [ "CMD", "redis-cli", "ping" ]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${SOURCE_CONTEXT_MINIO_ROOT_USER:?SOURCE_CONTEXT_MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${SOURCE_CONTEXT_MINIO_ROOT_PASSWORD:?SOURCE_CONTEXT_MINIO_ROOT_PASSWORD is required}
    ports:
      - "127.0.0.1:${SOURCE_CONTEXT_MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${SOURCE_CONTEXT_MINIO_CONSOLE_PORT:-9001}:9001"
#    volumes:
#      - minio_data:/data
    command: server /data --address :9000 --console-address :9001
    healthcheck:
      <<: *healthcheck_base
      test: [ "CMD", "mc", "ready", "local"]

volumes:
  workspace_repos:
    name: workspace_repo
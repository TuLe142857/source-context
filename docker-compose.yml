services:

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: source-context-backend:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NEO4J_HOST: "neo4j"

    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BACKEND_EXTERNAL_PORT:-8000}:8000"
    volumes:
      - ./workspace-repositories:/app/workspace-repositories

  celery-worker:
    image: source-context-backend:latest
    command: uv run celery -A app.core.celery.celery_app worker --loglevel=info
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NEO4J_HOST: "neo4j"
    depends_on:
      backend:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./workspace-repositories:/app/workspace-repositories


  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_EXTERNAL_PORT:-5173}:5173"


  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-myuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mypassword}
      POSTGRES_DB: ${POSTGRES_DB:-mydb_dev}
    volumes:
      - ./docker/postgres:/docker-entrypoint-initdb.d/
    ports:
      - "127.0.0.1:${DB_EXTERNAL_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-myuser} -d ${POSTGRES_DB:-mydb_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s


  neo4j:
    image: neo4j:community
    restart: unless-stopped
    environment:
      - NEO4J_AUTH=${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-neo4jpassword}
    ports:
      # For web UI
      - "127.0.0.1:${NEO4J_EXTERNAL_HTTP_PORT:-7474}:7474"
      # For driver
      - "127.0.0.1:${NEO4J_EXTERNAL_BOLT_PORT:-7687}:7687"
    healthcheck:
      test: [
        "CMD",
        "cypher-shell",
        "-u", "${NEO4J_USERNAME:-neo4j}",
        "-p", "${NEO4J_PASSWORD:-neo4jpassword}",
        "RETURN 1"
      ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${QDRANT_EXTERNAL_PORT_HTTP:-6333}:6333"
      - "127.0.0.1:${QDRANT_EXTERNAL_PORT_GRPC:-6334}:6334"
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY:-}
      - QDRANT__TELEMETRY_DISABLED=true
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s


  redis:
    image: redis:8.6
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_EXTERNAL_PORT:-6379}:6379"
    command: >
      redis-server
      --user default off
      --user ${REDIS_USER:-myuser} on ">${REDIS_PASSWORD:-mypassword}" allcommands allkeys allchannels
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s


  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --address :9000 --console-address :9001
    ports:
      - "127.0.0.1:${MINIO_API_EXTERNAL_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_EXTERNAL_PORT:-9001}:9001"
    healthcheck:
      test: [ "CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s


  
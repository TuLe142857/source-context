name: Publish MCP to PyPi

on:
  push:
    branches: 
      - master
    paths: 
      - "mcp/**"
    tags:
      - "v*.*.*"
  workflow_dispatch:

# Never cancel a publish half-way; queue the next one instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish PyPI
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@v2

      - name: Build
        run: uv build mcp

      - name: Publish
        run: uv publish --check-url https://pypi.org/simple/

name: Build sandbox images

on:
  push:
    branches:
      - master
    paths:
      - "docker/sandboxes/**"
      - ".github/workflows/build-sandboxes.yml"
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  PLATFORMS: linux/amd64,linux/arm64


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-sandbox:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: python310, dockerfile: python.Dockerfile, build_args: "PY_VERSION=3.10" }
          - { name: python311, dockerfile: python.Dockerfile, build_args: "PY_VERSION=3.11" }
          - { name: python312, dockerfile: python.Dockerfile, build_args: "PY_VERSION=3.12" }
          - { name: python313, dockerfile: python.Dockerfile, build_args: "PY_VERSION=3.13" }
          - { name: python314, dockerfile: python.Dockerfile, build_args: "PY_VERSION=3.14" }
          - { name: node22, dockerfile: node.Dockerfile, build_args: "NODE_VERSION=22" }
          - { name: node24, dockerfile: node.Dockerfile, build_args: "NODE_VERSION=24" }


    steps:
      # https://github.com/actions/checkout
      - name: Checkout
        uses: actions/checkout@v6

      # https://github.com/docker/setup-qemu-action
      # Emulates non-native architectures
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ env.PLATFORMS }}

      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Lowercase image name
        run: |
          echo "IMAGE_NAME=$(echo '${{ github.repository }}/sandbox/${{ matrix.name }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
      
      # https://github.com/docker/metadata-action
      # - master       -> :latest + :master + :sha-<short>
      # - other branch -> :<branch> + :sha-<short>  (e.g. feat/x -> :feat-x)
      # - tag vX.Y.Z   -> :vX.Y.Z + :sha-<short>    (never moves :latest)
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,prefix=sha-
            type=ref,event=tag
      
      # https://github.com/docker/login-action
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      # https://github.com/docker/build-push-action
      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ./docker/sandboxes
          file: ./docker/sandboxes/${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=sandbox-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=sandbox-${{ matrix.name }}

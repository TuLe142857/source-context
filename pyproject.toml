# ===========================================
#   SETUP FOR VIRTUAL WORKSPACE
#   DO NOT USE [project] config here
# ===========================================

[tool.uv.workspace]
members = [
    "backend",
    "mcp",
]


[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.22",
]


[tool.pytest]
minversion = "9.0"
pythonpath = [
  "backend",
  "mcp"
]
testpaths = [
    "backend/tests",
    "mcp/tests",
]
python_files = [
    "test_*.py",
    "*_test.py",
]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
]
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "e2e: end-to-end tests",
]



[tool.coverage.run]
branch = true
source = [
    "app",
    "source_context_mcp",
]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
target-version = "py313"
line-length = 120
indent-width = 4
extend-exclude = [
    ".venv",
    "frontend",
    "backend/data",
    "workspace-repositories",
]
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "__pypackages__",
    "build",
    "dist",
    "venv",
    "frontend"
]



[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "W"
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = [
    "app",
    "source_context_mcp",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
mypy_path = ["backend", "mcp/src"]
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
show_error_codes = true
pretty = true
exclude = [
    "^frontend/",
    "^backend/data/",
    "^workspace-repositories/",
]





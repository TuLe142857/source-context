

services:
  backend:
    build:
      target: dev
    image: source-context-backend:dev
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./pyproject.toml:/app/pyproject.toml
      - ./uv.lock:/app/uv.lock
      - ./workspace-repositories:/app/workspace-repositories

  celery-worker:
    image: source-context-backend:dev
    command: uv run celery -A app.core.celery.celery_app worker --loglevel=info
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./pyproject.toml:/app/pyproject.toml
      - ./uv.lock:/app/uv.lock
      - ./workspace-repositories:/app/workspace-repositories

  frontend:
    build:
      target: dev
    volumes:
      - ./frontend:/app
      - /app/node_modules


  postgres:
    image: postgres:17

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mydb_dev}
      POSTGRES_USER: ${POSTGRES_USER:-myuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mypassword}

    volumes:
      - postgres_data_dev:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-myuser} -d ${POSTGRES_DB:-mydb_dev}"
        ]
      interval: 10s
      retries: 5


  neo4j:
    volumes:
      - neo4j_data_dev:/data


  qdrant:
    volumes:
      - qdrant_data_dev:/qdrant/storage


  redis:
    volumes:
      - redis_data_dev:/data


  minio:
    volumes:
      - minio_data_dev:/data

  # ==============================================
  # ADDITIONAL CONTAINER FOR DEVELOPMENTS ONLY
  # ==============================================

  redis_insight:
    image: redis/redisinsight:latest
    restart: unless-stopped
    environment:
      RI_REDIS_HOST: redis
      RI_REDIS_PORT: 6379
      RI_REDIS_USERNAME: ${REDIS_USER:?Variable is not set or empty}
      RI_REDIS_PASSWORD: ${REDIS_PASSWORD:?Variable is not set or empty}
      RI_REDIS_DB: 0
    volumes:
      - redis_insight_data_dev:/data
    ports:
      - "127.0.0.1:${REDIS_INSIGHT_EXTERNAL_PORT:-5540}:5540"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:5540/api/health/ || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s


  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAIL_HOG_SERVER_EXTERNAL_PORT:-1025}:1025"
      - "127.0.0.1:${MAIL_HOG_CONSOLE_EXTERNAL_PORT:-8025}:8025"


volumes:
  postgres_data_dev:
  neo4j_data_dev:
  qdrant_data_dev:
  redis_data_dev:
  redis_insight_data_dev:
  minio_data_dev:

services:
  alloy:
    image: grafana/alloy:v1.18.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:12345:12345"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker/observability/alloy/config.alloy:/etc/alloy/config.alloy
      - alloy_data:/var/lib/alloy/data
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy

  loki:
    image: grafana/loki:3.7
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./docker/observability/loki/loki-config.yml:/etc/loki/loki-config.yml
      - loki_data:/loki
    command:
      - -config.file=/etc/loki/loki-config.yml

  grafana:
    image: grafana/grafana:13.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
    volumes:
      - ./docker/observability/grafana/provisioning:/etc/grafana/provisioning
      - ./docker/observability/grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  loki_data:
  alloy_data:
